name: Publish daily car

on:
  schedule:
    # Post time is 17:47 Bucharest (POST_TIME in publish.py) - that never changes.
    # GitHub starts our cron runs ~7 hours late, so runs are spread over the day:
    # every 30 min from 10:47 to 19:47 Bucharest (08:47-17:47 UTC). A run that
    # starts before 17:47 finds nothing due and stops; the first run that starts
    # after 17:47 posts. Works whether GitHub is on time or hours late.
    - cron: "47 8-17 * * *"
    - cron: "17 9-17 * * *"
  workflow_dispatch:
    inputs:
      story_number:
        description: "Car number to publish (leave empty = today's car)"
        required: false
        default: ""
      dry_run:
        description: "Test only (create containers, do NOT publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-cars
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841427086110395"
          CONTENT: cars
          STORY_NUMBER: ${{ github.event.inputs.story_number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: python3 publish.py

      - name: Save posting log
        run: |
          if [ -n "$(git status --porcelain posted.json)" ]; then
            git config user.name "iliaCollections bot"
            git config user.email "actions@github.com"
            git add posted.json
            git commit -m "Posted car $(python3 -c 'import json;print(max(json.load(open("posted.json"))))')"
            git pull --rebase
            git push
          fi
